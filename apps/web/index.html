<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Volume, a private book production studio." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Volume</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser bar colour: the canvas token (packages/ui tokens.css), light and dark. src/lib/theme.tsx keeps it in step with a saved theme. -->
    <meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16172A" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint so there is no flash. Mirrors src/lib/theme.tsx.
      (function () {
        var pref = null;
        try {
          pref = window.localStorage.getItem("volume.theme");
        } catch (e) {
          pref = null;
        }
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
